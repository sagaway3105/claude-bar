name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    # glassEffect などを `if #available(macOS 26.0, *)` で参照している（コンパイル時ガードは無い）ため、
    # ビルドには macOS 26 SDK = Xcode 26 が載ったランナーが必要。
    # macos-26 は Apple Silicon の GA イメージ（macos-latest と同じ）。
    # 配布ターゲットは macOS 14 だが、旧ランナー(macos-14/15)ではSDKが古くコンパイルできないので、
    # 旧OSの挙動は CLAUDEBAR_FORCE_LEGACY=1 のテストで代替検証する。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 環境を記録
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: ビルド
        run: swift build

      - name: テスト
        run: swift test

      - name: 旧OS分岐のテスト（macOS 14/15が通るコード経路）
        run: CLAUDEBAR_FORCE_LEGACY=1 swift test

      - name: .app の組み立てが壊れていないか（make-app.sh・証明書が無いのでad-hoc署名になる）
        run: ./scripts/make-app.sh

      - name: 生成した .app の署名を検証
        run: codesign --verify --deep --strict build/ClaudeBar.app

      # ───────────────────────────────────────────────────────────
      # 配布zipの健全性ガード（Issue #1: v1.3.0〜v1.5.2 で AppleDouble 混入 →
      # 展開時に署名シールが壊れ「開発元を検証できない」事故が発生した再発防止）
      - name: 配布zipに AppleDouble（._*）が混入しないか
        run: |
          ditto -c -k --keepParent --norsrc --noextattr build/ClaudeBar.app build/ClaudeBar-ci.zip
          ENTRIES=$(zipinfo -1 build/ClaudeBar-ci.zip | grep -E '(^|/)\._' || true)
          if [ -n "$ENTRIES" ]; then
            echo "❌ AppleDouble（._*）が混入（展開時に署名が壊れます）:"
            echo "$ENTRIES" | head
            exit 1
          fi
          echo "✅ ._ エントリ 0 件"

      - name: zip展開後も署名が有効か（ditto / unzip 両系統）
        # Finder/アーカイブユーティリティは ditto と同じ Bomb 系展開のため ditto で代表させる
        run: |
          for TOOL in ditto unzip; do
            WORK=$(mktemp -d)
            case "$TOOL" in
              ditto) ditto -x -k build/ClaudeBar-ci.zip "$WORK" ;;
              unzip) unzip -qq build/ClaudeBar-ci.zip -d "$WORK" ;;
            esac
            codesign --verify --deep --strict "$WORK/ClaudeBar.app"
            rm -rf "$WORK"
            echo "✅ ${TOOL} 展開後の署名OK"
          done

      - name: 古いOSでの確認用に zip を渡す
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeBar-ci
          path: build/ClaudeBar-ci.zip
          retention-days: 1

  # 古いOSのランナーでは SDK が古くてビルドできないので、macOS 26 で作った .app を渡して動かす。
  # 確認できるのは起動とクラッシュまで（v1.6.0 の起動時クラッシュの種類）。見た目と操作は
  # docs/RELEASE_CHECKLIST.md の手動項目で確認する。
  # macOS 14 のランナーは 2026-11-02 に廃止されたため、CI では確認できない
  old-os-smoke:
    needs: build-test
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClaudeBar-ci

      - name: 環境を記録して展開
        run: |
          sw_vers
          ditto -x -k ClaudeBar-ci.zip .

      - name: 古いOSで文字と音のリソースを読めるか
        run: CLAUDEBAR_SELFTEST=resources ClaudeBar.app/Contents/MacOS/ClaudeBar

      - name: 古いOSで起動して落ちないか
        run: |
          ClaudeBar.app/Contents/MacOS/ClaudeBar &
          PID=$!
          sleep 20
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "❌ 起動から20秒以内に終了しました"
            ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i claudebar | head -3 || true
            exit 1
          fi
          kill "$PID"
          echo "✅ 20秒間動作"
